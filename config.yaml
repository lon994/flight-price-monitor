# 机票价格监控 配置（长沙→青岛）
routes:
  - from: CSX
    from_name: 长沙
    to: TAO
    to_name: 青岛
    dates:
      - "2026-09-30"
      - "2026-10-01"
      - "2026-10-02"
    alert_threshold: 700

  - from: TAO
    from_name: 青岛
    to: CSX
    to_name: 长沙
    dates:
      - "2026-10-05"
      - "2026-10-06"
    alert_threshold: 900

platforms:
  - fliggy
  - qunar
  - tongcheng

schedule:
  interval_minutes: 90
  jitter_minutes: 30
  run_on_start: true

crawler:
  headless: true
  timeout_seconds: 45
  delay_min: 5
  delay_max: 15
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
  mobile_user_agent: ""
  debug: false
  debug_dir: debug
  user_data_dir: user_data

output:
  db_path: data/prices.db
  log_path: logs/monitor.log

notifier:
  push_drop_min: 30
  push_rise_min: 50
  serverchan:
    enabled: true
    send_key: ""
    channel: ""
