name: Flight Price Monitor

on:
  schedule:
    # 每天 01:00 / 07:00 / 13:00 / 19:00 UTC（北京时间 09/15/21/03 点）
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      from_code:
        description: '出发地三字码 (如 LZO)'
        required: true
        default: 'LZO'
      from_name:
        description: '出发地名称 (如 泸州)'
        required: true
        default: '泸州'
      to_code:
        description: '目的地三字码 (如 BJS)'
        required: true
        default: 'BJS'
      to_name:
        description: '目的地名称 (如 北京)'
        required: true
        default: '北京'
      depart_dates:
        description: '去程日期, 逗号分隔 (如 2026-09-30,2026-10-01)'
        required: true
        default: '2026-09-30,2026-10-01,2026-10-02'
      return_dates:
        description: '回程日期, 逗号分隔 (可选)'
        required: false
        default: '2026-10-06'
      platforms:
        description: '平台: fliggy,tuniu,qunar,tongcheng,ctrip'
        required: false
        default: 'fliggy,tuniu,qunar,tongcheng'
      threshold:
        description: '低价提醒阈值（元）'
        required: false
        default: '0'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Use committed config.yaml (preferred) or build from workflow_dispatch
        run: |
          if [ -f config.yaml ]; then
            echo "Using committed config.yaml (CSX->TAO)"
            # SERVERCHAN_KEY secret 自动注入为环境变量，notifier 会读取
            # (config.yaml 的 send_key 留空即可，见 notifier.py build_notifier)
          else
            echo "config.yaml not found, building from workflow_dispatch"
            python scripts/build_config.py \
              --from-code "${{ github.event.inputs.from_code || 'LZO' }}" \
              --from-name "${{ github.event.inputs.from_name || '泸州' }}" \
              --to-code "${{ github.event.inputs.to_code || 'BJS' }}" \
              --to-name "${{ github.event.inputs.to_name || '北京' }}" \
              --dates "${{ github.event.inputs.depart_dates || '2026-09-30,2026-10-01,2026-10-02' }}" \
              --return-dates "${{ github.event.inputs.return_dates || '2026-10-06' }}" \
              --platforms "${{ github.event.inputs.platforms || 'fliggy,tuniu,qunar,tongcheng' }}" \
              --threshold "${{ github.event.inputs.threshold || '0' }}" \
              --serverchan-key "${{ secrets.SERVERCHAN_KEY }}" \
              --output config.yaml
          fi

      - name: Run price monitor (one round)
        run: python main.py --once
        timeout-minutes: 15

      - name: Export latest results to JSON
        run: |
          mkdir -p docs/data
          python scripts/export_results.py \
            --db data/prices.db \
            --out docs/data/latest.json

      - name: Render HTML report
        run: |
          python scripts/render_report.py \
            --results-file docs/data/latest.json \
            --out-dir docs/data

      - name: Commit data & report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: update price data $(date -u '+%Y-%m-%d %H:%M UTC')"
            # 拉取远程最新（避免远程有其他提交导致 push 失败）
            git pull --rebase origin main || echo "pull failed, will retry push"
            git push origin main
          fi
